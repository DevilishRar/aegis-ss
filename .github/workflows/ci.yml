name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Source audit (no network / no writes)
        shell: pwsh
        run: ./scripts/source-audit.ps1
      - name: Build (locked)
        run: cargo build --release --locked
      - name: Test (locked)
        run: cargo test --release --locked
      - name: CLI smoke benchmark
        shell: pwsh
        run: ./target/release/aegis-cli.exe --bench 5
